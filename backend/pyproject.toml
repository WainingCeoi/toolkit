[project]
name = "toolkit-backend"
version = "0.1.0"
description = "FastAPI backend for Toolkit — media & file utilities engine + web API."
requires-python = ">=3.14"
dependencies = [
    # --- web layer ---
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.8",
    "python-dotenv>=1.2.2",
    "beautifulsoup4>=4.15.0",
    # No macOS x86_64 wheel; Intel Macs skip it and use toolkit_engine/aescbc.py.
    "cryptography>=50.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "ffmpeg-progress-yield>=1.1.3",
    "ffmpeg-python>=0.2.0",
    "lxml>=6.1.1",
    # opencv-python, not -headless: mineru needs opencv-python and both ship cv2.
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "pymupdf>=1.28.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scandir-rs>=2.9.9",
    "segno>=1.6.6",
    "selenium>=4.46.0",
    "webdriver-manager>=4.1.2",
]

# docmd: MinerU's ~1 GB ML stack; `make install` adds it, a lean `uv sync` skips it.
# watermark: torch for LaMa; not simple-lama-inpainting, which pins numpy<2 (no 3.14).
[project.optional-dependencies]
docmd = ["mineru[core]>=3.4.4"]
watermark = ["torch>=2.13.0"]

# ruff is declared, not taken from PATH, so two machines lint identically.
[dependency-groups]
dev = ["pytest>=9.1.1", "httpx2>=2.9.1", "ruff>=0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `sources = ["src"]` strips the prefix so all four packages land at the wheel root.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/subgen", "src/toolkit_engine", "src/toolkit_api", "src/watermark"]

[tool.uv]
package = true

# `slow` marks the LaMa tests (~200 MB download); run them with `uv run pytest -m slow`.
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["slow: needs the watermark extra (torch) and the LaMa checkpoint"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 88
target-version = "py314"

# preview is what makes E1xx/E2xx/E3xx fire under select = ["E"].
[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "N", "B", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
