[project]
name = "toolkit-backend"
version = "0.1.0"
description = "FastAPI backend for Toolkit — media & file utilities engine + web API."
requires-python = ">=3.14"
dependencies = [
    # --- web layer ---
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.8",
    "python-dotenv>=1.2.2",
    "beautifulsoup4>=4.15.0",
    # BitComet's WebUI login envelope is AES-256-CBC; the stdlib has hashing
    # and HMAC but no block cipher, so this is the one thing it cannot do.
    "cryptography>=50.0.0",
    "ffmpeg-progress-yield>=1.1.3",
    "ffmpeg-python>=0.2.0",
    "lxml>=6.1.1",
    # Watermark Remover's mask detection and fast inpainting (dual top-hat,
    # cv2.inpaint). opencv-python rather than -headless on purpose: mineru
    # (docmd extra) depends on opencv-python, and the two dists both ship the
    # cv2 package — declaring the same one keeps a single install either way.
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "pymupdf>=1.28.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scandir-rs>=2.9.9",
    "segno>=1.6.6",
    "selenium>=4.46.0",
    "webdriver-manager>=4.1.2",
]

# MinerU's ML stack is ~1 GB and only Doc→Markdown needs it, so it stays optional:
# `make install` includes it, a lean `uv sync` skips it, and the tool reports
# "MinerU not installed" rather than failing.
#
# `watermark` is torch for the Watermark Remover's LaMa inpainter (the engine
# downloads the big-lama TorchScript checkpoint itself on first use). It is NOT
# simple-lama-inpainting: that wrapper pins numpy<2 and pillow<10, neither of
# which exists for Python 3.14, so the engine carries the ~40 lines of pre/post
# processing instead. Without this extra the tool still runs on cv2.inpaint.
[project.optional-dependencies]
docmd = ["mineru[core]>=3.4.4"]
watermark = ["torch>=2.13.0"]

# ruff is declared, not taken from PATH, so two machines lint identically.
[dependency-groups]
dev = ["pytest>=9.1.1", "httpx2>=2.9.1", "ruff>=0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `sources = ["src"]` strips the prefix so all four packages land at the wheel root.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/subgen", "src/toolkit_engine", "src/toolkit_api", "src/watermark"]

[tool.uv]
package = true

# Warnings are errors, so a new deprecation can't slip in unnoticed.
# `slow` covers the LaMa inpainting tests (first run downloads a ~200 MB
# checkpoint), deselected by default; run them with `uv run pytest -m slow`
# (a later -m on the command line overrides the one from addopts).
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["slow: needs the watermark extra (torch) and the LaMa checkpoint"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 88
target-version = "py314"

# `preview` is what makes E1xx/E2xx/E3xx fire — without it `select = ["E"]`
# silently matches none of them.
[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "N", "B", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
