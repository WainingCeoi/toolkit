[project]
name = "toolkit-backend"
version = "0.1.0"
description = "FastAPI backend for Toolkit — media & file utilities engine + web API."
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx2>=2.13.1,<3",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.34",
    "sse-starlette>=3.7.1",
    "python-dotenv>=1.2.4",
    "beautifulsoup4>=4.15.0",
    # Engine uses aescbc.py on Intel; MCP also requires crypto transitively via JWT.
    "cryptography>=50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "ffmpeg-progress-yield>=1.1.4",
    "ffmpeg-python>=0.2.0",
    "lxml>=6.1.3",
    "packaging>=26.4",
    "pillow>=13.0.0",
    "pillow-heif>=1.9.0",
    "pymupdf>=2.2",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "scandir-rs>=2.10.1",
    "segno>=1.6.6",
    "selenium>=4.54.0",
    "webdriver-manager>=4.1.2",
]

[project.scripts]
toolkit-mcp = "toolkit_mcp.__main__:main"

# docmd: MinerU's local parsing stack; `make dev` and `make init` honor EXTRAS.
[project.optional-dependencies]
docmd = ["mineru>=4.2.3"]

# ruff is declared, not taken from PATH, so two machines lint identically.
[dependency-groups]
dev = ["pytest>=9.2.0", "httpx2>=2.16.2", "ruff>=0.17.6"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# `sources = ["src"]` strips the prefix so all packages land at the wheel root.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/subgen", "src/toolkit_engine", "src/toolkit_api", "src/toolkit_mcp"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py314"

# preview is what makes E1xx/E2xx/E3xx fire under select = ["E"].
[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "N", "B", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
