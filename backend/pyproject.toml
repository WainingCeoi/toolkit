[project]
name = "toolkit-backend"
version = "0.1.0"
description = "FastAPI backend for Toolkit — media & file utilities engine + web API."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.5.0",
    "python-dotenv>=1.2.4",
    "beautifulsoup4>=4.15.0",
    # No macOS x86_64 wheel; Intel Macs skip it and use toolkit_engine/aescbc.py.
    "cryptography>=50.0.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "ffmpeg-progress-yield>=1.1.4",
    "ffmpeg-python>=0.2.0",
    "lxml>=6.1.3",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scandir-rs>=2.10.1",
    "segno>=1.6.6",
    "selenium>=4.51.0",
    "webdriver-manager>=4.1.2",
]

# docmd: MinerU's local parsing stack; `make install` adds it, `uv sync` skips it.
[project.optional-dependencies]
docmd = ["mineru>=4.0.12"]

# ruff is declared, not taken from PATH, so two machines lint identically.
[dependency-groups]
dev = ["pytest>=9.1.1", "httpx2>=2.13.1", "ruff>=0.17.1"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

# `sources = ["src"]` strips the prefix so all three packages land at the wheel root.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/subgen", "src/toolkit_engine", "src/toolkit_api"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py314"

# preview is what makes E1xx/E2xx/E3xx fire under select = ["E"].
[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "N", "B", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
