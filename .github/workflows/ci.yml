# Runs the same gate `make test` runs locally, so the two cannot drift.
#
# Split into two jobs rather than one `make test` call: they are independent,
# so a Python failure and a TypeScript failure surface in the same run instead
# of the first one hiding the second.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # requires-python is >=3.14; uv fetches it rather than relying on the
      # runner image happening to ship it.
      - run: uv python install
      # No extras: the docmd and watermark extras pull MinerU and torch, which
      # are hundreds of megabytes and are exercised by tests that skip when
      # their engine is absent.
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # typecheck first: vite build strips types without checking them, so the
      # build alone proves almost nothing about a TypeScript error.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
